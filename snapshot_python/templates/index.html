<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>계정 정보 조회</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding-top: 50px;
        }
        input[type="text"] {
            width: 400px;
            padding: 10px;
            font-size: 16px;
        }
        input[type="submit"] {
            padding: 10px 20px;
            font-size: 16px;
            margin-left: 10px;
        }
        .container {
            display: inline-block;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>계정 정보 조회</h1>
    <div class="container">
        <form action="{{ url_for('account_detail') }}" method="get">
            <label for="address">계정 주소를 입력하세요:</label><br>
            <input type="text" id="address" name="address" required><br><br>
            <input type="submit" value="조회">
        </form>
    </div>
</body>
</html>
