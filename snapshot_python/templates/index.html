<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>계정 정보 조회 및 MetaMask 설정</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding-top: 50px;
        }
        input[type="text"] {
            width: 400px;
            padding: 10px;
            font-size: 16px;
        }
        input[type="submit"], button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
        }
        .container {
            display: inline-block;
            text-align: center;
        }
        .error-message {
            color: red;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>계정 정보 조회 및 MetaMask 설정</h1>
    <div class="container">
        <!-- 계정 주소 입력 폼 -->
        <form id="account-form" onsubmit="checkAccount(event)">
            <label for="address">계정 주소를 입력하세요:</label><br>
            <input type="text" id="address" name="address" required><br><br>
            <input type="submit" value="조회">
        </form>
        <!-- 에러 메시지 표시 -->
        <div id="error-message" class="error-message"></div>
        <!-- MetaMask에 ESN 토큰 추가 버튼 -->
        <button onclick="addEsnToken()">MetaMask에 ESN 토큰 추가</button>
        <!-- BSC Mainnet으로 전환 버튼 -->
        <button onclick="addNetwork()">BSC Mainnet으로 전환</button>
        <!-- Ethersocial Network로 전환 버튼 -->
        <button onclick="switchToESN()">Ethersocial Network로 전환</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/web3/dist/web3.min.js"></script>
    <script>
        // Ethersocial Network 정보
        const ESN_RPC_URL = 'https://api.esn.gonspool.com/';
        const ESN_NATIVE_CURRENCY = {
            name: 'ESN',
            symbol: 'ESN',
            decimals: 18,
        };

        // ESN 토큰 정보
        const ESN_TOKEN_ADDRESS = '0x0377d09c5a741a481bd79cf38e2d112248eb451e'; 
        const ESN_TOKEN_SYMBOL = 'ESN';                  
        const ESN_TOKEN_DECIMALS = 18;                   
        const ESN_TOKEN_IMAGE = 'https://ethersocial.network/images/esn-logo-footer.png';

        // Ethersocial Network를 이용하여 계정 확인
        async function checkAccount(event) {
            event.preventDefault(); // 폼 제출 방지
            const address = document.getElementById('address').value;
            const errorMessage = document.getElementById('error-message');

            if (!Web3.utils.isAddress(address)) {
                errorMessage.textContent = `${address}는 유효한 주소가 아닙니다.`;
                return;
            }

            try {
                const web3 = new Web3(ESN_RPC_URL); // ESN 네트워크를 사용
                const balance = await web3.eth.getBalance(address);

                if (parseInt(balance) === 0) {
                    errorMessage.textContent = `${address}는 존재하지 않는 계정입니다.`;
                } else {
                    errorMessage.textContent = ''; // 에러 메시지 초기화
                    // const balanceInESN = web3.utils.fromWei(balance, 'ether');
                    // alert(`${address}의 잔액은 ${balanceInESN} ESN입니다.`);
                    // 잔액이 있을 경우 계정 상세 페이지로 전환
                    window.location.href = `/account?address=${address}`;
                }
            } catch (error) {
                console.error('계정 확인 중 오류 발생:', error);
                errorMessage.textContent = '계정 확인 중 오류가 발생했습니다. 다시 시도해주세요.';
            }
        }

        async function addEsnToken() {
            if (typeof window.ethereum === 'undefined') {
                alert('MetaMask가 설치되어 있지 않습니다. 설치 후 다시 시도해주세요.');
                return;
            }

            try {
                await window.ethereum.request({
                    method: 'wallet_watchAsset',
                    params: {
                        type: 'ERC20',
                        options: {
                            address: ESN_TOKEN_ADDRESS,
                            symbol: ESN_TOKEN_SYMBOL,
                            decimals: ESN_TOKEN_DECIMALS,
                            image: ESN_TOKEN_IMAGE,
                        },
                    },
                });
                alert('ESN 토큰이 MetaMask에 성공적으로 추가되었습니다.');
            } catch (error) {
                handleError(error);
            }
        }

        async function addNetwork() {
            const params = [{
                chainId: '0x38',
                chainName: 'BNB Smart Chain Mainnet',
                nativeCurrency: {
                    name: 'BNB',
                    symbol: 'BNB',
                    decimals: 18,
                },
                rpcUrls: ['https://bsc-dataseed1.binance.org/'],
                blockExplorerUrls: ['https://bscscan.com'],
            }];

            await switchNetwork(params, 'BNB Smart Chain Mainnet');
        }

        async function switchToESN() {
            const params = [{
                chainId: '0x797e', // 31102 in decimal
                chainName: 'Ethersocial Network',
                nativeCurrency: ESN_NATIVE_CURRENCY,
                rpcUrls: [ESN_RPC_URL],
                blockExplorerUrls: ['https://escblock.gonsmine.com'],
            }];

            await switchNetwork(params, 'Ethersocial Network');
        }

        async function switchNetwork(params, networkName) {
            if (typeof window.ethereum === 'undefined') {
                alert('MetaMask가 설치되어 있지 않습니다.');
                return;
            }

            try {
                await window.ethereum.request({ method: 'wallet_addEthereumChain', params });
                alert(`${networkName}으로 전환되었습니다.`);
            } catch (error) {
                handleError(error);
            }
        }

        function handleError(error) {
            let errorMessage = '알 수 없는 오류가 발생했습니다.';
            if (error.code === 4001) {
                errorMessage = '사용자가 요청을 거부했습니다.';
            } else if (error.message) {
                errorMessage = `오류: ${error.message}`;
            }
            alert(errorMessage);
        }
    </script>
</body>
</html>
