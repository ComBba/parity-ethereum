<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>계정 정보 조회 및 MetaMask 설정</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding-top: 50px;
        }
        input[type="text"] {
            width: 400px;
            padding: 10px;
            font-size: 16px;
        }
        input[type="submit"], button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
        }
        .container {
            display: inline-block;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>계정 정보 조회 및 MetaMask 설정</h1>
    <div class="container">
        <!-- 기본 계정 정보 조회 폼 -->
        <form action="{{ url_for('account_detail') }}" method="get">
            <label for="address">계정 주소를 입력하세요:</label><br>
            <input type="text" id="address" name="address" required><br><br>
            <input type="submit" value="조회">
        </form>
        <!-- MetaMask에 ESN 토큰 추가 버튼 -->
        <button onclick="addEsnToken()">MetaMask에 ESN 토큰 추가</button>
        <!-- BSC Mainnet으로 네트워크 전환 버튼 -->
        <button onclick="addNetwork()">BSC Mainnet으로 전환</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/web3/dist/web3.min.js"></script>
    <script>
        // ESN 토큰 정보
        const ESN_TOKEN_ADDRESS = '0x0377d09c5a741a481bd79cf38e2d112248eb451e'; // ESN 토큰 주소
        const ESN_TOKEN_SYMBOL = 'ESN';                  // ESN 토큰 심볼
        const ESN_TOKEN_DECIMALS = 18;                   // ESN 토큰 소수점 자리수
        const ESN_TOKEN_IMAGE = 'https://ethersocial.network/images/esn-logo-footer.png'; // 토큰 이미지 (URL)

        // BSC Mainnet 정보
        const SiteNetID = '56'; // BSC Network ID
        const SiteNetChainID = '0x38'; // BSC Chain ID (hexadecimal)
        const SiteNetName = 'BNB Smart Chain Mainnet';
        const BSC_RPC_URL = 'https://bsc-dataseed1.binance.org/';
        const BSC_BLOCK_EXPLORER_URL = 'https://bscscan.com';
        const BSC_NATIVE_CURRENCY = {
            name: 'BNB',
            symbol: 'BNB',
            decimals: 18,
        };

        // MetaMask에 ESN 토큰 추가
        async function addEsnToken() {
            if (typeof window.ethereum === 'undefined') {
                alert('MetaMask가 설치되어 있지 않습니다. 설치 후 다시 시도해주세요.');
                return;
            }

            try {
                await window.ethereum.request({
                    method: 'wallet_watchAsset',
                    params: {
                        type: 'ERC20',
                        options: {
                            address: ESN_TOKEN_ADDRESS,
                            symbol: ESN_TOKEN_SYMBOL,
                            decimals: ESN_TOKEN_DECIMALS,
                            image: ESN_TOKEN_IMAGE,
                        },
                    },
                });
                alert('ESN 토큰이 MetaMask에 성공적으로 추가되었습니다.');
            } catch (error) {
                handleError(error);
            }
        }

        // BSC Mainnet으로 네트워크 전환
        async function addNetwork() {
            let eth;
            if (typeof ethereum !== 'undefined') {
                eth = new Web3(ethereum);
            } else if (typeof web3 !== 'undefined') {
                eth = new Web3(web3.givenProvider);
            } else {
                alert('Web3 지원 브라우저가 필요합니다. MetaMask를 설치하세요.');
                return;
            }

            try {
                const network = await eth.eth.net.getId();
                if (network.toString() === SiteNetID) {
                    alert('이미 BNB Smart Chain Mainnet에 연결되어 있습니다.');
                    return;
                }

                const params = [{
                    chainId: SiteNetChainID,
                    chainName: SiteNetName,
                    nativeCurrency: BSC_NATIVE_CURRENCY,
                    rpcUrls: [BSC_RPC_URL],
                    blockExplorerUrls: [BSC_BLOCK_EXPLORER_URL],
                }];

                await ethereum.request({ method: 'wallet_addEthereumChain', params });
                alert('BSC Mainnet으로 전환되었습니다.');
            } catch (error) {
                handleError(error);
            }
        }

        // 에러 핸들링 함수
        function handleError(error) {
            let errorMessage = '알 수 없는 오류가 발생했습니다.';
            if (error.code === 4001) {
                errorMessage = '사용자가 요청을 거부했습니다.';
            } else if (error.message) {
                errorMessage = `오류: ${error.message}`;
            }
            alert(errorMessage);
        }
    </script>
</body>
</html>
